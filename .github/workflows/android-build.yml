name: Android Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK platform 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Generate bundled ambient assets
        run: python3 scripts/gen_audio.py

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup release signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p "app/keystore"
          STORE_PASS="${SIGNING_STORE_PASSWORD:-***PURGED***}"
          KEY_ALIAS="${SIGNING_KEY_ALIAS:-pomodoro}"
          KEY_PASS="${SIGNING_KEY_PASSWORD:-***PURGED***}"

          DEFAULT_KEYSTORE_B64="***PURGED_KEYSTORE_BLOB***"

          RAW_KEY="${SIGNING_KEY:-$DEFAULT_KEYSTORE_B64}"
          echo "$RAW_KEY" | tr -d '\r\n ' | base64 -d > "app/keystore/release.jks"

          if ! keytool -list -keystore "app/keystore/release.jks" -storepass "$STORE_PASS" > /dev/null 2>&1; then
            echo "Using fallback persistent keystore..."
            echo "$DEFAULT_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "app/keystore/release.jks"
          fi

          echo "SIGNING_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Unit tests (timer engine, policy)
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: |
          ./gradlew assembleDebug --console=plain --stacktrace 2>&1 | tee assemble-debug.log || {
            echo "::error::assembleDebug failed! Last 150 lines of build output:"
            tail -n 150 assemble-debug.log
            exit 1
          }

      - name: Assemble release APK
        env:
          SIGNING_KEY_ALIAS: ${{ env.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ env.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ env.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --console=plain --stacktrace 2>&1 | tee assemble-release.log || {
            echo "::error::assembleRelease failed! Last 150 lines of build output:"
            tail -n 150 assemble-release.log
            exit 1
          }

      - name: Bundle release AAB
        env:
          SIGNING_KEY_ALIAS: ${{ env.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ env.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ env.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --console=plain --stacktrace 2>&1 | tee bundle-release.log || {
            echo "::error::bundleRelease failed! Last 150 lines of build output:"
            tail -n 150 bundle-release.log
            exit 1
          }

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: aod-pomodoro-apks
          path: app/build/outputs/apk/**/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aod-pomodoro-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Stage Release Assets
        run: |
          mkdir -p dist
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -not -path "*/baselineProfiles/*" -not -path "*/debug/*" -exec cp -v {} dist/ ';'
          echo "=== Staged files in dist/ ==="
          ls -la dist/

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - << 'EOF'
          import os, sys, urllib.request, urllib.error, json

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]

          # 1. Get or Create Release
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases/tags/{tag}",
              headers={"Authorization": f"token {token}", "User-Agent": "AOD-Pomodoro"}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode())
                  rel_id = data["id"]
                  print(f"Found existing release ID: {rel_id}")
          except Exception as e:
              print(f"Creating release for tag {tag}...")
              create_req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases",
                  data=json.dumps({"tag_name": tag, "name": f"AOD Pomodoro {tag}", "body": f"AOD Pomodoro {tag} Release"}).encode(),
                  headers={"Authorization": f"token {token}", "Content-Type": "application/json", "User-Agent": "AOD-Pomodoro"}
              )
              with urllib.request.urlopen(create_req) as resp:
                  data = json.loads(resp.read().decode())
                  rel_id = data["id"]
                  print(f"Created release ID: {rel_id}")

          # 2. Upload assets in dist/
          dist_files = sorted([os.path.join("dist", f) for f in os.listdir("dist") if f.endswith(".apk") or f.endswith(".aab")])
          print(f"Found {len(dist_files)} assets to upload: {dist_files}")
          if not dist_files:
              print("No assets found in dist!")
              sys.exit(1)

          for fpath in dist_files:
              fname = os.path.basename(fpath)
              with open(fpath, "rb") as f:
                  body = f.read()

              upload_url = f"https://uploads.github.com/repos/{repo}/releases/{rel_id}/assets?name={fname}"
              print(f"Uploading {fname} ({len(body) / 1024 / 1024:.2f} MB)...")

              up_req = urllib.request.Request(
                  upload_url,
                  data=body,
                  headers={
                      "Authorization": f"token {token}",
                      "Content-Type": "application/octet-stream",
                      "User-Agent": "AOD-Pomodoro"
                  }
              )
              try:
                  with urllib.request.urlopen(up_req) as resp:
                      res_json = json.loads(resp.read().decode())
                      print(f"✓ Uploaded {fname} (asset ID: {res_json.get('id')})")
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode()
                  print(f"HTTP Error {e.code}: {err_body}")
                  if "already_exists" in err_body:
                      print(f"{fname} already exists on release.")
                  else:
                      sys.exit(1)
          print("All release assets published successfully!")
          EOF
