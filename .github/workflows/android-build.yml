name: Android Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK platform 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Generate bundled ambient assets
        run: python3 scripts/gen_audio.py

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup release signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p "app/keystore"
          STORE_PASS="${SIGNING_STORE_PASSWORD:-***PURGED***}"
          KEY_ALIAS="${SIGNING_KEY_ALIAS:-pomodoro}"
          KEY_PASS="${SIGNING_KEY_PASSWORD:-***PURGED***}"

          DEFAULT_KEYSTORE_B64="***PURGED_KEYSTORE_BLOB***"

          RAW_KEY="${SIGNING_KEY:-$DEFAULT_KEYSTORE_B64}"
          echo "$RAW_KEY" | tr -d '\r\n ' | base64 -d > "app/keystore/release.jks"

          if ! keytool -list -keystore "app/keystore/release.jks" -storepass "$STORE_PASS" > /dev/null 2>&1; then
            echo "Using fallback persistent keystore..."
            echo "$DEFAULT_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "app/keystore/release.jks"
          fi

          echo "SIGNING_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Unit tests (timer engine, policy)
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: |
          ./gradlew assembleDebug --console=plain --stacktrace 2>&1 | tee assemble-debug.log || {
            echo "::error::assembleDebug failed! Last 150 lines of build output:"
            tail -n 150 assemble-debug.log
            exit 1
          }

      - name: Assemble release APK
        env:
          SIGNING_KEY_ALIAS: ${{ env.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ env.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ env.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --console=plain --stacktrace 2>&1 | tee assemble-release.log || {
            echo "::error::assembleRelease failed! Last 150 lines of build output:"
            tail -n 150 assemble-release.log
            exit 1
          }

      - name: Bundle release AAB
        env:
          SIGNING_KEY_ALIAS: ${{ env.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ env.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ env.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --console=plain --stacktrace 2>&1 | tee bundle-release.log || {
            echo "::error::bundleRelease failed! Last 150 lines of build output:"
            tail -n 150 bundle-release.log
            exit 1
          }

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: aod-pomodoro-apks
          path: app/build/outputs/apk/**/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aod-pomodoro-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk dist/ 2>/dev/null || true
          cp app/build/outputs/bundle/release/*.aab dist/ 2>/dev/null || true
          echo "Files ready to publish:"
          ls -la dist/

          python3 - << 'EOF'
          import os, sys, json, urllib.request

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['GITHUB_REF_NAME']

          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'GitHubActions'
          }

          # 1. Check existing release or create published release
          req = urllib.request.Request(f'https://api.github.com/repos/{repo}/releases/tags/{tag}', headers=headers)
          try:
              res = urllib.request.urlopen(req)
              release = json.loads(res.read())
              print(f"Found existing release: id={release['id']}")
              if release.get('draft'):
                  edit_req = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/releases/{release['id']}",
                      data=json.dumps({"draft": False}).encode(),
                      headers=headers,
                      method='PATCH'
                  )
                  urllib.request.urlopen(edit_req)
                  print("Published draft release.")
          except Exception:
              print(f"Creating release for {tag}...")
              create_req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/releases',
                  data=json.dumps({
                      "tag_name": tag,
                      "name": f"AOD Pomodoro {tag}",
                      "draft": False,
                      "prerelease": False,
                      "generate_release_notes": True
                  }).encode(),
                  headers=headers,
                  method='POST'
              )
              res = urllib.request.urlopen(create_req)
              release = json.loads(res.read())
              print(f"Release created: id={release['id']}")

          upload_url = release['upload_url'].split('{')[0]

          # 2. Upload assets
          dist_dir = 'dist'
          for fname in os.listdir(dist_dir):
              fpath = os.path.join(dist_dir, fname)
              if not os.path.isfile(fpath): continue
              print(f"Uploading {fname} ({os.path.getsize(fpath)} bytes)...")
              with open(fpath, 'rb') as f:
                  data = f.read()
              
              upload_req = urllib.request.Request(
                  f"{upload_url}?name={fname}",
                  data=data,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/octet-stream',
                      'User-Agent': 'GitHubActions'
                  },
                  method='POST'
              )
              try:
                  urllib.request.urlopen(upload_req)
                  print(f"Successfully uploaded {fname}")
              except Exception as err:
                  print(f"Upload response for {fname}: {err}")
          EOF
