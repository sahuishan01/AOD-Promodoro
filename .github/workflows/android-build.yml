name: Android Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK platform 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Generate bundled ambient assets
        run: python3 scripts/gen_audio.py

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup release signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p "app/keystore"
          STORE_PASS="${SIGNING_STORE_PASSWORD:-***PURGED***}"
          KEY_ALIAS="${SIGNING_KEY_ALIAS:-pomodoro}"
          KEY_PASS="${SIGNING_KEY_PASSWORD:-***PURGED***}"

          DEFAULT_KEYSTORE_B64="***PURGED_KEYSTORE_BLOB***"

          RAW_KEY="${SIGNING_KEY:-$DEFAULT_KEYSTORE_B64}"
          echo "$RAW_KEY" | tr -d '\r\n ' | base64 -d > "app/keystore/release.jks"

          if ! keytool -list -keystore "app/keystore/release.jks" -storepass "$STORE_PASS" > /dev/null 2>&1; then
            echo "Using fallback persistent keystore..."
            echo "$DEFAULT_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "app/keystore/release.jks"
          fi

          echo "SIGNING_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Unit tests (timer engine, policy)
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: |
          ./gradlew assembleDebug --console=plain --stacktrace 2>&1 | tee assemble-debug.log || {
            echo "::error::assembleDebug failed! Last 150 lines of build output:"
            tail -n 150 assemble-debug.log
            exit 1
          }

      - name: Assemble release APK
        env:
          SIGNING_KEY_ALIAS: ${{ env.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ env.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ env.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --console=plain --stacktrace 2>&1 | tee assemble-release.log || {
            echo "::error::assembleRelease failed! Last 150 lines of build output:"
            tail -n 150 assemble-release.log
            exit 1
          }

      - name: Bundle release AAB
        env:
          SIGNING_KEY_ALIAS: ${{ env.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ env.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ env.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --console=plain --stacktrace 2>&1 | tee bundle-release.log || {
            echo "::error::bundleRelease failed! Last 150 lines of build output:"
            tail -n 150 bundle-release.log
            exit 1
          }

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: aod-pomodoro-apks
          path: app/build/outputs/apk/**/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aod-pomodoro-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Stage Release Assets
        run: |
          mkdir -p dist
          find app/build/outputs -name "*.apk" -not -path "*/baselineProfiles/*" -exec cp -v {} dist/ ';'
          find app/build/outputs -name "*.aab" -exec cp -v {} dist/ ';'
          ls -la dist/

      - name: Publish GitHub Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const tag = '${{ github.ref_name }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 1. Get or create release
            let release;
            try {
              const res = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = res.data;
              console.log(`Found release ${release.id}`);
            } catch (e) {
              console.log(`Creating release for ${tag}...`);
              const res = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `AOD Pomodoro ${tag}`,
                body: `Release ${tag}`,
                draft: false,
                prerelease: false
              });
              release = res.data;
              console.log(`Created release ${release.id}`);
            }

            // 2. Read dist files
            const distDir = 'dist';
            const files = fs.readdirSync(distDir).filter(f => f.endsWith('.apk') || f.endsWith('.aab'));
            console.log(`Files to upload: ${files.join(', ')}`);

            // 3. Delete existing duplicate assets
            const assetsRes = await github.rest.repos.listReleaseAssets({ owner, repo, release_id: release.id });
            for (const asset of assetsRes.data) {
              if (files.includes(asset.name)) {
                console.log(`Deleting duplicate asset ${asset.name} (${asset.id})...`);
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
            }

            // 4. Upload each binary
            for (const file of files) {
              const filePath = path.join(distDir, file);
              const data = fs.readFileSync(filePath);
              console.log(`Uploading ${file} (${(data.length / 1024 / 1024).toFixed(2)} MB)...`);
              await github.request({
                method: 'POST',
                url: release.upload_url,
                name: file,
                data: data,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': data.length
                }
              });
              console.log(`✓ Uploaded ${file}`);
            }
