name: Android Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK platform 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Generate bundled ambient assets
        run: python3 scripts/gen_audio.py

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup release signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p "app/keystore"
          STORE_PASS="${SIGNING_STORE_PASSWORD:-***PURGED***}"
          KEY_ALIAS="${SIGNING_KEY_ALIAS:-pomodoro}"
          KEY_PASS="${SIGNING_KEY_PASSWORD:-***PURGED***}"

          DEFAULT_KEYSTORE_B64="***PURGED_KEYSTORE_BLOB***"

          RAW_KEY="${SIGNING_KEY:-$DEFAULT_KEYSTORE_B64}"
          echo "$RAW_KEY" | tr -d '\r\n ' | base64 -d > "app/keystore/release.jks"

          if ! keytool -list -keystore "app/keystore/release.jks" -storepass "$STORE_PASS" > /dev/null 2>&1; then
            echo "Using fallback persistent keystore..."
            echo "$DEFAULT_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "app/keystore/release.jks"
          fi

          echo "SIGNING_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Unit tests (timer engine, policy)
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: |
          ./gradlew assembleDebug --console=plain --stacktrace 2>&1 | tee assemble-debug.log || {
            echo "::error::assembleDebug failed! Last 150 lines of build output:"
            tail -n 150 assemble-debug.log
            exit 1
          }

      - name: Assemble release APK
        env:
          SIGNING_KEY_ALIAS: ${{ env.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ env.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ env.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --console=plain --stacktrace 2>&1 | tee assemble-release.log || {
            echo "::error::assembleRelease failed! Last 150 lines of build output:"
            tail -n 150 assemble-release.log
            exit 1
          }

      - name: Bundle release AAB
        env:
          SIGNING_KEY_ALIAS: ${{ env.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ env.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ env.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --console=plain --stacktrace 2>&1 | tee bundle-release.log || {
            echo "::error::bundleRelease failed! Last 150 lines of build output:"
            tail -n 150 bundle-release.log
            exit 1
          }

      - name: Verify build outputs
        run: |
          echo "=== All build outputs ==="
          find app/build/outputs -type f -name "*.apk" -o -name "*.aab" | sort
          echo "=== APK release ==="
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "NO RELEASE APK DIR"
          echo "=== APK debug ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "NO DEBUG APK DIR"
          echo "=== AAB release ==="
          ls -la app/build/outputs/bundle/release/ 2>/dev/null || echo "NO RELEASE AAB DIR"

      - name: Stage Release Assets
        run: |
          echo "=== Staging artifacts with Python ==="
          python3 -c "
          import os, shutil
          os.makedirs('dist', exist_ok=True)
          for root, dirs, files in os.walk('app/build/outputs'):
              if 'baselineProfiles' in root or 'intermediates' in root:
                  continue
              for f in files:
                  if f.endswith('.apk') or f.endswith('.aab'):
                      src = os.path.join(root, f)
                      dst = os.path.join('dist', f)
                      print(f'Staging: {src} -> {dst}')
                      shutil.copy2(src, dst)
          print('Staged files in dist/:', os.listdir('dist'))
          "
          ls -la dist/

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Publishing Release with GitHub CLI ==="
          gh release delete "${{ github.ref_name }}" --yes || true
          gh release create "${{ github.ref_name }}" dist/app-release.apk dist/app-debug.apk dist/app-release.aab --title "AOD Pomodoro ${{ github.ref_name }}" --notes "Automated production build for AOD Pomodoro ${{ github.ref_name }}."

