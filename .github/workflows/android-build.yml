name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK platform 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Generate bundled ambient assets
        run: python3 scripts/gen_audio.py

      - name: Bootstrap Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Decode signing keystore from Secrets (if configured)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "${SIGNING_KEY:-}" ]; then
            mkdir -p "$RUNNER_TEMP"
            echo "$SIGNING_KEY" | base64 -di > "$RUNNER_TEMP/release.jks" 2>/dev/null || true
            if [ -s "$RUNNER_TEMP/release.jks" ]; then
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
              echo "Keystore decoded successfully from GitHub Secrets."
            fi
          fi

      - name: Unit tests (timer engine, policy)
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Assemble & bundle release
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease assembleRelease --console=plain --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: aod-pomodoro-apks
          path: app/build/outputs/apk/**/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aod-pomodoro-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
