name: Android Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK platform 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Generate bundled ambient assets
        run: python3 scripts/gen_audio.py

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup release signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p "app/keystore"
          STORE_PASS="${SIGNING_STORE_PASSWORD:-***PURGED***}"
          KEY_ALIAS="${SIGNING_KEY_ALIAS:-pomodoro}"
          KEY_PASS="${SIGNING_KEY_PASSWORD:-***PURGED***}"

          DEFAULT_KEYSTORE_B64="***PURGED_KEYSTORE_BLOB***"

          RAW_KEY="${SIGNING_KEY:-$DEFAULT_KEYSTORE_B64}"
          echo "$RAW_KEY" | tr -d '\r\n ' | base64 -d > "app/keystore/release.jks"

          if ! keytool -list -keystore "app/keystore/release.jks" -storepass "$STORE_PASS" > /dev/null 2>&1; then
            echo "Using fallback persistent keystore..."
            echo "$DEFAULT_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "app/keystore/release.jks"
          fi

          echo "SIGNING_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Unit tests (timer engine, policy)
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: |
          ./gradlew assembleDebug --console=plain --stacktrace 2>&1 | tee assemble-debug.log || {
            echo "::error::assembleDebug failed! Last 150 lines of build output:"
            tail -n 150 assemble-debug.log
            exit 1
          }

      - name: Assemble release APK
        env:
          SIGNING_KEY_ALIAS: ${{ env.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ env.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ env.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --console=plain --stacktrace 2>&1 | tee assemble-release.log || {
            echo "::error::assembleRelease failed! Last 150 lines of build output:"
            tail -n 150 assemble-release.log
            exit 1
          }

      - name: Bundle release AAB
        env:
          SIGNING_KEY_ALIAS: ${{ env.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ env.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ env.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --console=plain --stacktrace 2>&1 | tee bundle-release.log || {
            echo "::error::bundleRelease failed! Last 150 lines of build output:"
            tail -n 150 bundle-release.log
            exit 1
          }

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: aod-pomodoro-apks
          path: app/build/outputs/apk/**/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aod-pomodoro-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Stage Release Assets
        run: |
          mkdir -p dist
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -not -path "*/baselineProfiles/*" -not -path "*/debug/*" -exec cp -v {} dist/ ';'
          echo "=== Staged files in dist/ ==="
          ls -la dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view --repo "${{ github.repository }}" "${{ github.ref_name }}" > /dev/null 2>&1 || \
            gh release create --repo "${{ github.repository }}" "${{ github.ref_name }}" \
              --title "AOD Pomodoro ${{ github.ref_name }}" \
              --notes "AOD Pomodoro ${{ github.ref_name }} Release"

          RELEASE_ID=$(gh release view --repo "${{ github.repository }}" "${{ github.ref_name }}" --json id -q .id)
          echo "Target Release ID is $RELEASE_ID"

          for FILE in dist/*; do
            FNAME=$(basename "$FILE")
            echo "Uploading $FNAME..."
            HTTP_STATUS=$(curl -s -o /tmp/upload_err.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$FILE" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$FNAME")

            echo "Upload HTTP Status for $FNAME: $HTTP_STATUS"
            if [ "$HTTP_STATUS" -ne 201 ]; then
              echo "::error::Upload failed for $FNAME! Response:"
              cat /tmp/upload_err.json
              exit 1
            fi
            echo "✓ Uploaded $FNAME"
          done
