name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK platform 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Generate bundled ambient assets
        run: python3 scripts/gen_audio.py

      - name: Bootstrap Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Unit tests (timer engine, policy)
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble debug APK (installable artifact)
        run: ./gradlew assembleDebug --console=plain

      - name: Assemble unsigned release AAB
        run: ./gradlew bundleRelease --console=plain

      # Release signing is wired but skipped unless org secrets are set:
      #   SIGNING_KEY (base64 of .jks), SIGNING_KEY_ALIAS, SIGNING_STORE_PASSWORD, SIGNING_KEY_PASSWORD
      # Uncomment to enable:
      # - name: Decode signing key
      #   if: ${{ secrets.SIGNING_KEY != '' }}
      #   run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aod-pomodromo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aod-pomodromo-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore
